# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.per-file-ignores]
# Test-code conventions that don't apply to library/integration code.
"tests/**" = [
    "S101", # assert is the standard way to check expectations in pytest
    "PLR2004", # magic values are fine/expected in test assertions
    "TC002", # runtime imports for fixtures (e.g. HomeAssistant) are fine in tests
    "TC003", # same as above for stdlib imports
    "ARG001", # pytest fixtures are often requested for their side effect only
    "PT022", # this project's fixtures intentionally use yield for consistency
]


[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
